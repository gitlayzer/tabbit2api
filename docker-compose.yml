services:
  tabbit2api:
    image: ghcr.io/gitlayzer/tabbit2api:latest
    pull_policy: always
    # 如需本地构建可解除下行注释:
    # build: .
    container_name: tabbit2api
    restart: unless-stopped
    ports:
      - "${PORT:-8800}:8800"
    volumes:
      - tabbit2api_data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # 在此填入从 Tabbit 网页复制的 Token（支持逗号分隔多个账号）:
      - TABBIT_TOKEN=${TABBIT_TOKEN:-}
      # 客户端调用时的全局 API Key（可选，留空则无需鉴权）:
      - TABBIT_API_KEY=${TABBIT_API_KEY:-}
    networks:
      - tabbit2api_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/v1/models')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  tabbit2api_data:

networks:
  tabbit2api_net:
    driver: bridge