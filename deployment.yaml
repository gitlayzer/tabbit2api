apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tabbit2api-pvc
  labels:
    app: tabbit2api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName: standard # 如集群有特定 StorageClass 可解除注释并指定

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tabbit2api
  labels:
    app: tabbit2api
spec:
  replicas: 1
  strategy:
    type: Recreate # 因挂载数据持久化卷，单副本建议使用 Recreate 避免挂载并发冲突
  selector:
    matchLabels:
      app: tabbit2api
  template:
    metadata:
      labels:
        app: tabbit2api
    spec:
      # 如镜像为私有仓库，需解除下行注释配置拉取凭证 secret:
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        - name: tabbit2api
          image: ghcr.io/gitlayzer/tabbit2api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
              name: http
          env:
            - name: PORT
              value: "8800"
            - name: TZ
              value: "Asia/Shanghai"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8800
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: tabbit2api-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: tabbit2api-svc
  labels:
    app: tabbit2api
spec:
  type: ClusterIP # 如需在宿主机外部端口直接访问，可改为 NodePort
  selector:
    app: tabbit2api
  ports:
    - name: http
      port: 8800
      targetPort: 8800
      # nodePort: 30880 # 若 type 改为 NodePort 可指定该端口
